[project]
site_name = "Pinbot"
site_description = "Pinbot documentation"
site_url = "https://pinbot.cc/"

repo_url = "https://github.com/Pinbot-factory"
repo_name = "Pinbot"

nav = [
    { "Home" = "index.md" },
    { "Cradle Generator" = [
        { "Get started" = "cradle-generator/get-started.md" },
        { "KiCad export" = "cradle-generator/kicad-export.md" },
        { "Parameters" = "cradle-generator/parameters.md" },
    ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
custom_dir = "overrides"
# PNG fallback; the SVG favicon is added in overrides/main.html
favicon = "assets/images/favicon.png"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
logo = "lucide/circuit-board"

# Light/dark toggle; defaults to the system preference
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Pinbot-factory"
name = "Pinbot-factory on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
